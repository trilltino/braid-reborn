[package]
name = "braid-browser-harness"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Thin wasm-bindgen harness that drives the production browser journal, channel and Simpleton in real engines"

[lib]
crate-type = ["cdylib", "rlib"]

# The harness exists only for wasm32; native builds see an empty library so the
# workspace-wide checks keep working.
[target.'cfg(target_arch = "wasm32")'.dependencies]
braid-http = { path = "../braid-http", default-features = false, features = ["wasm"] }
braid-core = { path = "../braid-core", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1.0"
async-trait = "0.1"
async-channel = "2.3"
