[package]
name = "braid-iroh"
version = "0.1.0"
edition = "2021"
description = "Braid-HTTP over Iroh P2P - Pure Rust Backend Integration"
license = "MIT OR Apache-2.0"

[features]
default = ["proxy"]
proxy = []

[dependencies]
# ── Iroh P2P stack ──────────────────────────────────────────────
iroh = "=1.4.1"
n0-future = "0.3.2"
iroh-gossip = { version = "=0.101.0", features = ["net"] }
iroh-h3-axum = "=0.4.0"
iroh-h3-client = "=0.5.0"

braid_http_rs = { package = "braid-core", path = "../braid-core", features = [
    "server",
    "client",
] }

# ── Web framework ──────────────────────────────────────────────
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
http = "1"

# ── Async runtime ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"

# ── Serialization ──────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# ── Hashing ────────────────────────────────────────────────────
blake3 = "1"

# ── Utilities ──────────────────────────────────────────────────
tracing = "0.1"
anyhow = "1"
parking_lot = "0.12"
rand = "0.10.1"


[dev-dependencies]
tempfile = "3.10"
