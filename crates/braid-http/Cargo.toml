[package]
name = "braid-http"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
async-channel = "2.3"
uuid = { version = "1", features = ["v4", "serde", "js"] }
bytes = { version = "1", features = ["serde"] }
tracing = "0.1"
url = "2"
rand = {version = "0.8", features = ["small_rng"]}
futures = "0.3"
http = "1"
httpdate = "1"
sfv = "0.14"
sha2 = "0.10"
arbitrary = { version = "1.4", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.1", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features=["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "stream"] }
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1", features = ["sync", "macros"] }

[features]
default = ["native"]
native = []
wasm = ["dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:wasm-bindgen", "dep:js-sys"]
fuzzing = ["dep:arbitrary"]
# Deterministic persistence fault plans for tests; inert unless a plan is armed.
fault-injection = []
