[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
# Retain upstream license texts/notices when redistributing dependencies.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "Unlicense", "CC0-1.0", "CDLA-Permissive-2.0", "MPL-2.0", "BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
