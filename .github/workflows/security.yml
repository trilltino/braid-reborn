name: Dependency security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - deny.toml
      - .github/workflows/security.yml
jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.19.9,cargo-machete@0.9.1
      - run: cargo machete
      - run: cargo deny check bans licenses sources
      # This gate intentionally reports unresolved advisories; no blanket ignores.
      - run: cargo audit
      - run: cargo deny check advisories
